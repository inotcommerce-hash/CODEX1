<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BONUS · Press cell</title>
  <link rel="icon" href="assets/bonus-icon.png">
  <link rel="stylesheet" href="assets/inter.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="panel">
    <aside class="sidebar" aria-label="Machine navigation">
      <div class="identity"><img src="assets/bonus-icon.png" alt="BONUS ENGINEERING" width="32" height="32"></div>
      <div class="workspace-label">Workspace</div>
      <nav aria-label="Screens">
        <button data-page="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M3.5 10h17M10 10v10.5"/></svg><span>Overview</span></button>
        <button data-page="manual"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12V6a2 2 0 0 1 4 0v5-6a2 2 0 0 1 4 0v6-3a2 2 0 0 1 4 0v7c0 4-2 6-6 6h-2c-2 0-3-.7-4-2l-4-5c-1.5-2 .5-4 2-2l2 2Z"/></svg><span>Manual</span></button>
        <button data-page="alarms"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 6-2 7-2 7h16s-2-1-2-7ZM9 20h6"/></svg><span>Alarms</span><i id="nav-alarm-dot" hidden></i></button>
        <button data-page="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></svg><span>Diagnostics</span></button>
      </nav>
      <div class="sidebar-bottom"><strong>BE–070</strong><span>Press cell · Line 01</span><div class="demo-label"><i></i> Simulation</div></div>
    </aside>
    <div class="workspace">
      <header>
        <img class="header-logo" src="assets/bonus-logo.png" alt="BONUS ENGINEERING" width="580" height="122">
        <div class="breadcrumb">Line 01 <span>/</span> <strong id="screen-name">Overview</strong></div>
        <span id="status" role="status"></span>
        <button id="alarm-link" data-page="alarms" aria-label="Open alarms"></button>
        <time id="clock"></time>
      </header>
      <main id="content" aria-label="Machine workspace"></main>
      <footer>
        <div class="dock-info"><span id="mode"></span><small>Process stop · E-stop is hardware</small></div>
        <div class="actions">
          <button class="stop" id="stop"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10" rx="2"/></svg>Stop</button>
          <button class="primary" id="start"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 9 6-9 6Z"/></svg>Start cycle</button>
        </div>
      </footer>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
